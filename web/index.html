<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portfólio de Jean Costa, desenvolvedor de software. Conheça projetos web, mobile e APIs.">
  <meta name="author" content="Jean Costa">
  <meta name="theme-color" content="#080B12">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Jean Costa | Desenvolvedor de Software">
  <meta property="og:description" content="Projetos, tecnologias e experiência de Jean Costa.">
  <meta property="og:url" content="https://jeandevbr.vercel.app/">
  <meta name="twitter:card" content="summary">
  <title>Jean Costa | Desenvolvedor de Software</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Antic+Didone&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #080B12;
    }

    #app-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-content: center;
      gap: 18px;
      background: #080B12;
      color: #f3f1ec;
      font: 500 14px 'Work Sans', sans-serif;
      letter-spacing: 0.04em;
      transition: opacity 220ms ease, visibility 220ms ease;
    }

    #app-loading.is-hidden {
      opacity: 0;
      visibility: hidden;
    }

    #app-loading .loader {
      width: 38px;
      height: 38px;
      justify-self: center;
      border: 2px solid rgba(243, 241, 236, 0.18);
      border-top-color: #f3f1ec;
      border-radius: 50%;
      animation: app-loading-spin 0.8s linear infinite;
    }

    @keyframes app-loading-spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      #app-loading .loader { animation-duration: 1.8s; }
      #app-loading { transition-duration: 0ms; }
    }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-live="polite">
    <span class="loader" aria-hidden="true"></span>
    <span>Carregando...</span>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('app-loading');
      if (loading) loading.classList.add('is-hidden');
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
